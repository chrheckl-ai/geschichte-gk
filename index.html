<style>

  a.eintrag {

    border-radius: 6px; padding: 14px 16px; background: #fff;

  a.eintrag:hover { background: var(--panel); }
  .titel { display: block; font-weight: 600; color: var(--petrol); font-size: 1.05rem; }
